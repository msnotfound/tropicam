[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tropicam"
version = "0.0.1"
description = "Deterministic, CPU-only, training-free event-vision engine over the tropical (max-plus) semiring"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Kept optional on purpose: the core engine and its tests must run with numpy
# alone, so nothing in week 1 is gated on an install.
dev = ["pytest>=7"]
data = ["tonic>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
